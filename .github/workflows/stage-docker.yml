name: Roommy Home Stage
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roommy-home-user-service-stage
  cancel-in-progress: false
jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: roommy-home-deploy-vm
    timeout-minutes: 150
    environment: stage
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: Build immutable local image
        run: sudo /usr/local/sbin/roommy-home-ci build stage user-service "$GITHUB_SHA" --attempt "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --checkout "$GITHUB_WORKSPACE"
      - name: Preflight retained generation
        run: sudo /usr/local/sbin/roommy-home-ci check stage user-service "$GITHUB_SHA" --attempt "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Deploy retained generation
        run: sudo /usr/local/sbin/roommy-home-ci deploy stage user-service "$GITHUB_SHA" --attempt "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Verify Stage contracts and replicas
        run: sudo /usr/local/sbin/roommy-home-ci verify stage user-service "$GITHUB_SHA" --attempt "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
